[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "runlet"
version = "0.1.0"
description = "DAG pipeline orchestration with JSONL streaming and pluggable artifact storage"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Parth Lawania" }
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = ["pydantic>=2.7.0"]

[project.scripts]
runlet = "runlet.cli:main"

[project.optional-dependencies]
ui = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
s3 = [
    "boto3>=1.34.0,<2.0",
]
llm = [
    "openai>=1.30.0",
    "instructor>=1.3.0",
]
postgres = [
    "psycopg[binary]>=3.1.0,<4.0",
]
cockroachdb = [
    "psycopg[binary]>=3.1.0,<4.0",
]
sqlite = []
dev = [
    "pytest>=8",
    "pytest-cov",
    "moto[s3]>=5",
    "boto3",
    "ruff",
    "mypy",
    "pre-commit",
    "pydantic>=2.7.0",
    "openai>=1.30.0",
    "instructor>=1.3.0",
    "psycopg[binary]>=3.1.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["runlet*"]

[tool.setuptools.package-data]
"runlet.ui" = ["static/**/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP042"]  # str, Enum preferred over StrEnum for Pyright compatibility

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastapi", "fastapi.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
